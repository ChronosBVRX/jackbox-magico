services:
  - type: web
    name: jackbox-magico-v2
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGIN
        value: "*" # Configurar con el dominio real de Render en producción (ej: https://jackbox-magico-v2.onrender.com)
