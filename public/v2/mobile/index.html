<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Jackbox Mágico - Tu Varita</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="mobile-container">
    
    <!-- Join Form -->
    <div class="join-card glass-panel" id="join-form">
      <h1 class="text-gradient-gold">Jackbox Mágico</h1>
      
      <div class="input-group">
        <label for="in-code">Código de Sala</label>
        <input type="text" id="in-code" placeholder="ABCD" maxlength="4" style="text-transform: uppercase;">
      </div>

      <div class="input-group">
        <label for="in-name">Tu Nombre</label>
        <input type="text" id="in-name" placeholder="Nombre de mago" maxlength="15">
      </div>

      <div class="input-group">
        <label for="in-house">Tu Casa</label>
        <select id="in-house">
          <option value="Gryffindor">Gryffindor</option>
          <option value="Slytherin">Slytherin</option>
          <option value="Ravenclaw">Ravenclaw</option>
          <option value="Hufflepuff">Hufflepuff</option>
        </select>
      </div>

      <div class="input-group">
        <label for="in-gender">Género</label>
        <select id="in-gender">
          <option value="wizard">Mago 🧙‍♂️</option>
          <option value="witch">Maga 🧙‍♀️</option>
        </select>
      </div>

      <button class="btn-join-premium" id="btn-join">Conectar Varita</button>
    </div>

    <!-- Wait Screen -->
    <div class="wait-screen glass-panel" id="wait-screen" style="display: none;">
      <div class="wand-icon" id="wand-icon">✨</div>
      <div class="house-banner" id="house-banner">CASA</div>
      
      <p class="status-text">
        <strong id="player-name-display">Mago</strong>
        Mira la TV.<br>Tu varita ya está conectada.
      </p>

      <div style="font-size: 0.8rem; color: var(--color-text-dim); border-top: 1px solid var(--glass-border); padding-top: 1.5rem; margin-top: 1rem; width: 100%;">
        Esperando a que el Gran Comedor inicie la partida...
      </div>
    </div>

    <!-- Trivia Inputs -->
    <div class="game-view glass-panel" id="trivia-input" style="display: none;">
      <div class="trivia-grid">
        <button class="btn-trivia btn-a" data-answer="A">A</button>
        <button class="btn-trivia btn-b" data-answer="B">B</button>
        <button class="btn-trivia btn-c" data-answer="C">C</button>
        <button class="btn-trivia btn-d" data-answer="D">D</button>
      </div>
    </div>

    <!-- Snitch Input -->
    <div class="game-view glass-panel" id="snitch-input" style="display: none; text-align: center;">
      <h2 style="margin-bottom: 2rem;">¡ATRAPA LA SNITCH!</h2>
      <button class="btn-catch" id="btn-catch">¡ATRAPAR!</button>
      <div id="snitch-feedback" style="margin-top: 1rem; font-size: 1.2rem;"></div>
    </div>

    <!-- Duelo Hechizos Input -->
    <div class="game-view glass-panel" id="duelo-input" style="display: none; padding: 1rem;">
      <h2 style="text-align: center; margin-bottom: 1rem;">Elige Hechizo</h2>
      <div class="duelo-grid">
        <button class="btn-duelo" data-spell="Expelliarmus">Expelliarmus</button>
        <button class="btn-duelo" data-spell="Protego">Protego</button>
        <button class="btn-duelo" data-spell="Stupefy">Stupefy</button>
        <button class="btn-duelo" data-spell="Esquivar">Esquivar</button>
        <button class="btn-duelo" data-spell="Rictusempra">Rictusempra</button>
      </div>
    </div>

    <!-- Clash Input -->
    <div class="game-view glass-panel" id="clash-input" style="display: none; text-align: center;">
      <h2 style="margin-bottom: 2rem;">¡CHOQUE DE VARITAS!</h2>
      <button class="btn-clash" id="btn-clash">¡TOCAR RÁPIDO!</button>
    </div>

    <!-- Answer Sent Feedback -->
    <div class="wait-screen glass-panel" id="answer-sent" style="display: none;">
      <div class="wand-icon">✅</div>
      <p class="status-text">
        <strong>Respuesta Enviada</strong><br>
        Mira la TV para ver los resultados.
      </p>
    </div>

  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
