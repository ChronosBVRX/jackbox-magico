<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Jackbox Mágico - Tu Varita</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="mobile-container">
    
    <!-- Join Form -->
    <div class="join-card glass-panel" id="join-form">
      <h1 class="text-gradient-gold">Jackbox Mágico</h1>
      
      <div class="input-group">
        <label for="in-code">Código de Sala</label>
        <input type="text" id="in-code" placeholder="ABCD" maxlength="4" style="text-transform: uppercase;">
      </div>

      <div class="input-group">
        <label for="in-name">Tu Nombre</label>
        <input type="text" id="in-name" placeholder="Nombre de mago" maxlength="15">
      </div>

      <div class="input-group">
        <label for="in-house">Tu Casa</label>
        <select id="in-house">
          <option value="Gryffindor">Gryffindor</option>
          <option value="Slytherin">Slytherin</option>
          <option value="Ravenclaw">Ravenclaw</option>
          <option value="Hufflepuff">Hufflepuff</option>
        </select>
      </div>

      <div class="input-group">
        <label for="in-gender">Género</label>
        <select id="in-gender">
          <option value="wizard">Mago 🧙‍♂️</option>
          <option value="witch">Maga 🧙‍♀️</option>
        </select>
      </div>

      <button class="btn-join-premium" id="btn-join">Conectar Varita</button>
    </div>

    <!-- Wait Screen -->
    <div class="wait-screen glass-panel" id="wait-screen" style="display: none;">
      <div class="wand-icon" id="wand-icon">✨</div>
      <div class="house-banner" id="house-banner">CASA</div>
      
      <p class="status-text">
        <strong id="player-name-display">Mago</strong>
        Mira la TV.<br>Tu varita ya está conectada.
      </p>

      <div style="font-size: 0.8rem; color: var(--color-text-dim); border-top: 1px solid var(--glass-border); padding-top: 1.5rem; margin-top: 1rem; width: 100%;">
        Esperando a que el Gran Comedor inicie la partida...
      </div>
    </div>

  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
