<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jackbox Mágico - Copa de las Casas</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="bg-overlay" id="bg-overlay"></div>

  <div class="init-screen glass-panel" id="view-init" style="padding: 4rem;">
    <h1 class="text-gradient-gold" style="font-size: 4rem; margin-bottom: 1rem; font-family: var(--font-title);">Jackbox Mágico</h1>
    <p style="color: var(--color-text-dim); margin-bottom: 3rem; font-size: 1.2rem;">Bienvenido al Gran Comedor. Crea una sala para comenzar.</p>
    <button class="btn-create-premium" id="btn-create">Crear Nueva Sala</button>
  </div>

  <div class="tv-layout" id="view-lobby" style="display: none;">
    <!-- Header -->
    <header class="header">
      <div class="title-group">
        <h1 class="text-gradient-gold">Jackbox Mágico</h1>
        <p>Copa de las Casas</p>
      </div>
      <div class="connection-status">
        <div class="status-dot"></div>
        <span>Servidor Mágico Conectado</span>
      </div>
    </header>

    <!-- Main Content -->
    <main class="central-panel glass-panel">
      <div class="room-display">
        <span class="room-label">CÓDIGO DE SALA</span>
        <h2 class="room-code-large" id="display-code">----</h2>
      </div>

      <div class="qr-container">
        <div id="qrcode"></div>
        <div class="join-url" id="join-url">...</div>
      </div>
    </main>

    <!-- Players Grid -->
    <section class="players-section">
      <div class="players-header">
        <span id="status-text">Esperando magos...</span>
        <span id="player-count">0 / 8 Jugadores</span>
      </div>
      <div class="players-grid" id="players-list">
        <!-- Players generated by JS -->
      </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
      <button class="btn-start-premium" id="btn-start" style="display: none;">Iniciar Partida</button>
    </footer>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
  <script>
    // Simple candle generator for atmosphere
    const bg = document.getElementById('bg-overlay');
    for(let i=0; i<15; i++) {
      const candle = document.createElement('div');
      candle.className = 'candle';
      candle.style.left = Math.random() * 100 + '%';
      candle.style.top = Math.random() * 100 + '%';
      candle.style.animationDelay = Math.random() * 5 + 's';
      bg.appendChild(candle);
    }
  </script>
</body>
</html>
