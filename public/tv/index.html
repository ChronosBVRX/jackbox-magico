<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jackbox Mágico - TV</title>
    <style>
        body { background-color: #1a1a2e; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        h1 { color: #f39c12; font-size: 3rem; margin-bottom: 10px; }
        #lobby { display: none; text-align: center; width: 80%; }
        .room-code { font-size: 5rem; color: #e74c3c; font-weight: bold; letter-spacing: 5px; margin: 10px 0; }
        #qr-code { border: 10px solid white; border-radius: 10px; margin: 10px 0; max-width: 200px;}
        button { padding: 15px 30px; font-size: 1.5rem; cursor: pointer; background-color: #f39c12; color: #1a1a2e; border: none; border-radius: 10px; font-weight: bold; }
        
        /* Estilos para los jugadores que van entrando */
        #lista-jugadores { display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; margin-top: 30px; }
        .jugador-card { background-color: #2c3e50; padding: 15px 25px; border-radius: 10px; font-size: 1.5rem; font-weight: bold; animation: popIn 0.5s ease-out; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        @keyframes popIn { 0% { transform: scale(0); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>
    
    <div id="pantalla-inicio">
        <h1>Torneo de las Casas</h1>
        <button id="btn-crear">Iniciar Nueva Partida</button>
    </div>

    <div id="lobby">
        <h2>¡ÚNETE DESDE TU CELULAR!</h2>
        <div class="room-code" id="codigo-sala">HGW4</div>
        <img id="qr-code" src="" alt="Escanea para unirte">
        <h3>Magos listos para el torneo:</h3>
        
        <div id="lista-jugadores"></div>
    </div>

    <script>
        let intervaloRadar;

        // Función que revisa la base de datos cada 2 segundos
        function encenderRadar(roomCode) {
            intervaloRadar = setInterval(async () => {
                try {
                    const res = await fetch(`/api/room/${roomCode}/status`);
                    if (res.ok) {
                        const data = await res.json();
                        actualizarPantalla(data.players);
                    }
                } catch (error) {
                    console.error("Fallo de conexión en el radar...");
                }
            }, 2000);
        }

        // Función que dibuja a los jugadores en pantalla
        function actualizarPantalla(players) {
            const contenedor = document.getElementById('lista-jugadores');
            contenedor.innerHTML = ''; // Limpiamos la lista para redibujarla
            
            players.forEach(p => {
                const card = document.createElement('div');
                card.className = 'jugador-card';
                
                // Le ponemos el emoji según su casa
                let icono = '🦁';
                if(p.house === 'Slytherin') icono = '🐍';
                if(p.house === 'Ravenclaw') icono = '🦅';
                if(p.house === 'Hufflepuff') icono = '🦡';
                
                card.innerText = `${icono} ${p.name}`;
                contenedor.appendChild(card);
            });
        }

        document.getElementById('btn-crear').addEventListener('click', async () => {
            try {
                const res = await fetch('/api/host/create_room', { method: 'POST' });
                if (!res.ok) return alert("Error al crear la sala.");

                const data = await res.json();
                const roomCode = data.room_code;
                
                document.getElementById('pantalla-inicio').style.display = 'none';
                document.getElementById('lobby').style.display = 'block';
                document.getElementById('codigo-sala').innerText = roomCode;
                
                const baseUrl = window.location.origin; 
                const urlUnirse = `${baseUrl}/mobile/index.html?room=${roomCode}`;
                document.getElementById('qr-code').src = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(urlUnirse)}`;
                
                // ¡Magia! Encendemos el radar para que la TV empiece a escuchar
                encenderRadar(roomCode);
                
            } catch (error) {
                alert("Error de red: " + error);
            }
        });
    </script>
</body>
</html>
