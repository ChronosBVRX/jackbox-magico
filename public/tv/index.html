<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Jackbox Mágico - TV</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="/tv/styles.css">
</head>

<body>
  <audio
    id="tv-bg-music"
    src="https://drive.google.com/uc?export=download&id=1e-UToTsnDvadq9jYE-cioxg9gAkD0tRH"
    loop
    preload="auto">
  </audio>

  <button id="music-toggle" class="music-toggle" onclick="toggleBackgroundMusic()">
    ▶️ Activar música
  </button>

  <div class="ambient ambient-one"></div>
  <div class="ambient ambient-two"></div>

  <div class="floating-candles" aria-hidden="true">
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
  </div>

  <div id="view-inicio" class="screen visible">
    <section class="hero-card">
      <div class="badge">⚡ Copa de las Casas</div>

      <h1>Jackbox Mágico</h1>

      <p>
        Minijuegos rápidos para celular, puntos por casa y caos mágico controlado.
      </p>

      <button class="primary-btn giant" onclick="crearSala()">
        Iniciar Nueva Partida
      </button>
    </section>
  </div>

  <div id="view-lobby" class="screen">
    <section class="lobby-card">
      <div class="badge">📱 Únete desde tu celular</div>

      <div class="room-code" id="tv-code">----</div>

      <div class="qr-wrap">
        <img id="tv-qr" src="" alt="Código QR para unirse">
      </div>

      <p class="join-url" id="join-url"></p>

      <div id="lista-jugadores" class="players-list"></div>

      <div id="controles-host" class="host-controls">
        <select id="game-select" class="game-select"></select>

        <button class="primary-btn" onclick="lanzarJuegoSeleccionado()">
          Lanzar Minijuego
        </button>
      </div>
    </section>
  </div>

  <div id="view-game" class="screen">
    <main id="game-container" class="game-container"></main>
  </div>

  <div id="view-results" class="screen">
    <section class="results-card">
      <div class="badge">🏆 Resultados</div>

      <h2 id="titulo-resultados">Resultado de la ronda</h2>

      <div id="tv-correcta" class="correct-answer"></div>

      <p id="tv-explicacion" class="result-explanation"></p>

      <div id="tv-extra-results" class="result-list"></div>

      <div id="tv-marcadores" class="score-grid"></div>

      <button class="secondary-btn" onclick="volverAlLobby()">
        Volver al Lobby
      </button>
    </section>
  </div>

  <script src="/assets/js/magic-sounds.js"></script>
  <script src="/tv/app.js"></script>
</body>
</html>
