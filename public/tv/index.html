<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Jackbox Mágico - TV</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="/tv/styles.css?v=mapa-travieso-4">
  <link rel="stylesheet" href="/assets/css/duelo.css?v=mapa-travieso-4">
  <link rel="stylesheet" href="/assets/css/sombrero.css?v=mapa-travieso-4">
  <link rel="stylesheet" href="/assets/css/pociones.css?v=mapa-travieso-4">
  <link rel="stylesheet" href="/assets/css/snitch.css?v=mapa-travieso-4">
  <link rel="stylesheet" href="/assets/css/retratos.css?v=mapa-travieso-4">
  <link rel="stylesheet" href="/assets/css/mapa-travieso.css?v=mapa-travieso-4">
  <link rel="stylesheet" href="/assets/css/mapa-travieso-anti-flicker.css?v=mapa-travieso-4">
</head>

<body>
  <audio
    id="tv-bg-music"
    src="/assets/audio/fondo-tv.mp3"
    autoplay
    loop
    preload="auto">
  </audio>

  <button id="music-toggle" class="music-toggle" onclick="toggleBackgroundMusic()">
    ▶️ Activar música
  </button>

  <div class="ambient ambient-one"></div>
  <div class="ambient ambient-two"></div>

  <div class="floating-candles" aria-hidden="true">
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
  </div>

  <div id="view-inicio" class="screen visible">
    <section class="hero-card">
      <div class="badge">⚡ Copa de las Casas</div>

      <h1>Jackbox Mágico</h1>

      <p>
        Preparando sala mágica...
      </p>

      <button class="primary-btn giant" onclick="crearSala()">
        Crear sala manualmente
      </button>
    </section>
  </div>

  <div id="view-lobby" class="screen">
    <section class="lobby-card">
      <div class="badge">📱 Únete desde tu celular</div>

      <div class="room-code" id="tv-code">----</div>

      <div class="qr-wrap">
        <img id="tv-qr" src="" alt="Código QR para unirse">
      </div>

      <p class="join-url" id="join-url"></p>

      <div id="host-status" class="host-status">
        El primer celular que entre será el host de la partida.
      </div>

      <div id="lista-jugadores" class="players-list"></div>

      <div id="controles-host" class="host-controls">
        <div class="host-help">
          Esperando que el host inicie la partida desde su celular.
        </div>
      </div>
    </section>
  </div>

  <div id="view-game" class="screen">
    <main id="game-container" class="game-container"></main>
  </div>

  <div id="view-results" class="screen">
    <section class="results-card">
      <div class="badge">🏆 Resultados</div>

      <h2 id="titulo-resultados">Resultado de la ronda</h2>

      <div id="tv-correcta" class="correct-answer"></div>

      <p id="tv-explicacion" class="result-explanation"></p>

      <div id="tv-extra-results" class="result-list"></div>

      <div id="tv-marcadores" class="score-grid"></div>

      <div class="host-help">
        El host puede continuar desde su celular.
      </div>
    </section>
  </div>

  <script src="/assets/js/magic-sounds.js?v=mapa-travieso-4"></script>
  <script src="/assets/js/snitch-tv.js?v=mapa-travieso-4"></script>
  <script src="/assets/js/mapa-travieso.js?v=mapa-travieso-4"></script>

  <script src="/tv/app.js?v=mapa-travieso-4"></script>

  <script src="/assets/js/mapa-travieso-bridge.js?v=mapa-travieso-4"></script>
  <script src="/assets/js/retratos-tv.js?v=mapa-travieso-4"></script>
</body>
</html>
