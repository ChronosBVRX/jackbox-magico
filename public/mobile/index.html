<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Mágico</title>
    <style>
        body { background-color: #2c3e50; color: white; font-family: sans-serif; padding: 20px; text-align: center; }
        input, select, button { width: 100%; padding: 15px; margin: 10px 0; font-size: 18px; border-radius: 8px; border: none; box-sizing: border-box; }
        button { background-color: #27ae60; color: white; font-weight: bold; }
    </style>
</head>
<body>
    <h2>¡Únete a la partida!</h2>
    <input type="text" id="room" placeholder="Código de la Sala (ej. HGW4)">
    <input type="text" id="name" placeholder="Tu Nombre">
    <select id="house">
        <option value="Gryffindor">Leones (Rojo)</option>
        <option value="Slytherin">Serpientes (Verde)</option>
        <option value="Ravenclaw">Águilas (Azul)</option>
        <option value="Hufflepuff">Tejones (Amarillo)</option>
    </select>
    <button id="btn-unirse">Entrar</button>
</body>
</html>
