<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Control Mágico</title>

  <link rel="stylesheet" href="/mobile/styles.css">
</head>

<body>
  <div class="mobile-ambient"></div>

  <div id="view-login" class="screen visible">
    <section class="card">
      <div class="pill">⚡ Control mágico</div>

      <h1>Prepara tu varita</h1>

      <p>
        Entra a la sala, elige tu casa y mira la pantalla principal.
      </p>

      <input type="text" id="m-room" placeholder="Código de la sala" autocomplete="off">
      <input type="text" id="m-name" placeholder="Tu nombre o apodo" maxlength="15" autocomplete="off">

      <select id="m-house">
        <option value="Gryffindor">🦁 Leones (Gryffindor)</option>
        <option value="Slytherin">🐍 Serpientes (Slytherin)</option>
        <option value="Ravenclaw">🦅 Águilas (Ravenclaw)</option>
        <option value="Hufflepuff">🦡 Tejones (Hufflepuff)</option>
      </select>

      <button class="join-btn" id="btn-unirse">
        Entrar a la Sala
      </button>
    </section>
  </div>

  <div id="view-wait" class="screen">
    <section class="card">
      <div class="pill">🕯️ Conectado</div>

      <h1 id="wait-msg">¡Estás dentro!</h1>

      <p id="wait-subtitle">
        Mira la pantalla principal.
      </p>

      <div id="points-feedback" class="points-feedback"></div>

      <div class="spinner">⏳</div>
    </section>
  </div>

  <div id="view-game" class="screen">
    <section class="card">
      <div class="pill" id="game-pill">✨ Minijuego</div>

      <h1 id="m-pregunta-aviso">¡Responde rápido!</h1>

      <p id="m-question-small"></p>

      <div id="mobile-timer" class="mobile-timer">
        <div id="mobile-timer-bar" class="mobile-timer-bar"></div>
      </div>

      <div id="m-botones" class="buttons-grid"></div>

      <div id="mobile-status" class="status-box">
        Elige una opción cuando aparezca.
      </div>
    </section>
  </div>

  <script src="/assets/js/magic-sounds.js"></script>
  <script src="/mobile/app.js"></script>
</body>
</html>
