<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Control Mágico</title>

  <link rel="stylesheet" href="/mobile/styles.css?v=hechizo-incompleto-1">
  <link rel="stylesheet" href="/assets/css/duelo.css?v=hechizo-incompleto-1">
  <link rel="stylesheet" href="/assets/css/sombrero.css?v=hechizo-incompleto-1">
  <link rel="stylesheet" href="/assets/css/pociones.css?v=hechizo-incompleto-1">
  <link rel="stylesheet" href="/assets/css/snitch.css?v=hechizo-incompleto-1">
  <link rel="stylesheet" href="/assets/css/retratos.css?v=hechizo-incompleto-1">
  <link rel="stylesheet" href="/assets/css/mapa-travieso.css?v=hechizo-incompleto-1">
  <link rel="stylesheet" href="/assets/css/mapa-travieso-anti-flicker.css?v=hechizo-incompleto-1">
  <link rel="stylesheet" href="/assets/css/hechizo-incompleto.css?v=hechizo-incompleto-1">
  <link rel="stylesheet" href="/assets/css/caldero-mentiroso.css?v=caldero-mentiroso-1">
  <link rel="stylesheet" href="/assets/css/patronus-personalizado.css?v=patronus-1">
  <link rel="stylesheet" href="/assets/css/copa-final.css?v=copa-final-1">
  <link rel="stylesheet" href="/assets/css/duelo-polish.css?v=polish-1">
</head>

<body>
  <div class="mobile-ambient"></div>

  <div id="view-login" class="screen visible">
    <section class="card">
      <div class="pill">⚡ Control mágico</div>

      <h1>Prepara tu varita</h1>

      <p>
        Entra a la sala. La TV controlará la historia y tu celular será tu control de jugador.
      </p>

      <input
        type="text"
        id="m-room"
        placeholder="Código de la sala"
        autocomplete="off"
        maxlength="4"
      >

      <input
        type="text"
        id="m-name"
        placeholder="Tu nombre o apodo"
        maxlength="15"
        autocomplete="off"
      >

      <div class="gender-selection">
        <label class="gender-option">
          <input type="radio" name="m-gender" value="wizard" checked>
          <span class="gender-card">
            <span class="gender-icon">🧙‍♂️</span>
            <span class="gender-name">Mago</span>
          </span>
        </label>
        <label class="gender-option">
          <input type="radio" name="m-gender" value="witch">
          <span class="gender-card">
            <span class="gender-icon">🧙‍♀️</span>
            <span class="gender-name">Maga</span>
          </span>
        </label>
      </div>

      <select id="m-house">
        <option value="Gryffindor">🦁 Leones (Gryffindor)</option>
        <option value="Slytherin">🐍 Serpientes (Slytherin)</option>
        <option value="Ravenclaw">🦅 Águilas (Ravenclaw)</option>
        <option value="Hufflepuff">🦡 Tejones (Hufflepuff)</option>
      </select>

      <button class="join-btn" id="btn-unirse">
        Entrar a la Sala
      </button>
    </section>
  </div>

  <div id="view-wait" class="screen">
    <section class="card">
      <div class="pill" id="wait-pill">🕯️ Jugador</div>

      <h1 id="wait-msg">¡Estás dentro!</h1>

      <p id="wait-subtitle">
        Mira la TV. La pantalla principal controla la historia y las rondas.
      </p>


      <div id="points-feedback" class="points-feedback"></div>

      <div class="spinner">⏳</div>
    </section>
  </div>

  <div id="view-game" class="screen">
    <section class="card">
      <div class="pill" id="game-pill">✨ Minijuego</div>

      <h1 id="m-pregunta-aviso">¡Responde rápido!</h1>

      <p id="m-question-small"></p>

      <div id="mobile-timer" class="mobile-timer">
        <div id="mobile-timer-bar" class="mobile-timer-bar"></div>
      </div>

      <div id="m-botones" class="buttons-grid"></div>

      <div id="mobile-status" class="status-box">
        Elige una opción cuando aparezca.
      </div>

      <div id="mobile-game-container"></div>

      <div id="trivia-mobile-panel" class="trivia-mobile-panel"></div>

      <div id="duel-mobile-panel" class="duel-mobile-panel"></div>

      <div id="sombrero-mobile-panel" class="sombrero-mobile-vote-panel"></div>

      <div id="pociones-mobile-panel" class="pociones-mobile-panel"></div>

      <div id="snitch-mobile-panel" class="snitch-mobile-panel"></div>

      <div id="retratos-mobile-panel" class="retratos-mobile-panel"></div>

      <div id="mapa-mobile-panel" class="trivia-mobile-panel"></div>

      <div id="hechizo-mobile-panel" class="trivia-mobile-panel"></div>

      <div id="caldero-mobile-panel" class="trivia-mobile-panel"></div>

      <div id="patronus-mobile-panel" class="patronus-mobile-panel"></div>

      <div id="copa-final-mobile-panel" class="copa-mobile-panel"></div>

    </section>
  </div>

  <script src="/assets/js/mobile-room-guard.js?v=hechizo-incompleto-1"></script>
  <script src="/assets/js/magic-sounds.js?v=hechizo-incompleto-1"></script>
  <script src="/assets/js/sombrero-prompts.js?v=hechizo-incompleto-1"></script>
  <script src="/assets/js/snitch-mobile.js?v=hechizo-incompleto-1"></script>
  <script src="/assets/js/mapa-travieso.js?v=hechizo-incompleto-1"></script>
  <script src="/assets/js/hechizo-incompleto.js?v=hechizo-incompleto-1"></script>
  <script src="/assets/js/duelo-mobile.js?v=polish-1"></script>

  <script src="/assets/js/room-code-fix.js?v=room-fix-3"></script>

  <script src="/mobile/app.js?v=scene-wait-1"></script>

  <script src="/assets/js/story-ready-mobile.js?v=story-ready-mobile-no-auto-1"></script>

  <script src="/assets/js/mapa-travieso-bridge.js?v=hechizo-incompleto-1"></script>
  <script src="/assets/js/trivia-mobile-fix.js?v=hechizo-incompleto-1"></script>
  <script src="/assets/js/retratos-mobile.js?v=hechizo-incompleto-1"></script>
  <script src="/assets/js/caldero-mobile.js?v=caldero-mentiroso-1"></script>
  <script src="/assets/js/patronus-mobile.js?v=patronus-1"></script>
  <script src="/assets/js/copa-final-mobile.js?v=copa-final-1"></script>
  <script src="/assets/js/mobile-player-only.js?v=player-only-1"></script>
</body>
</html>
